name: Release and deploy

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable image tag
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - name: AKS credentials
        run: az aks get-credentials --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AKS_CLUSTER_NAME }}" --overwrite-existing
      - name: Install ingress and certificate controller
        run: |
          helm upgrade --install ingress-nginx ingress-nginx --repo https://kubernetes.github.io/ingress-nginx --namespace ingress-nginx --create-namespace --set controller.replicaCount=1 --set controller.service.loadBalancerIP="${{ vars.INGRESS_PUBLIC_IP }}" --set-string controller.service.annotations."service\\.beta\\.kubernetes\\.io/azure-load-balancer-resource-group"="${{ vars.AZURE_RESOURCE_GROUP }}"
          helm upgrade --install cert-manager cert-manager --repo https://charts.jetstack.io --namespace cert-manager --create-namespace --set crds.enabled=true
          kubectl apply -f helm/cluster-addons/letsencrypt-clusterissuer.yaml
      - name: Deploy immutable release
        run: |
          helm upgrade --install portfolio helm/portfolio --namespace portfolio --create-namespace --values helm/portfolio/values-prod.yaml --set image.repository="${{ secrets.DOCKERHUB_USERNAME }}/portfolio" --set image.tag="${{ needs.publish.outputs.image_tag }}" --set serviceAccount.workloadIdentityClientId="${{ vars.WORKLOAD_IDENTITY_CLIENT_ID }}" --atomic --timeout 5m
      - name: Smoke test
        run: curl --fail --retry 12 --retry-delay 10 --max-time 15 https://aliberkyildiz.com/healthz
      - name: Deployment summary
        if: always()
        run: |
          echo "## Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ needs.publish.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: https://aliberkyildiz.com" >> "$GITHUB_STEP_SUMMARY"
