name: Release and deploy

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable image tag
        required: true

permissions:
  contents: write
  id-token: write

env:
  RESOURCE_GROUP: rg-aby-portfolio-prod
  CONTAINER_APP: ca-aby-portfolio-prod
  CONTAINER_APP_ENVIRONMENT: cae-aby-portfolio-prod

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy immutable Container Apps revision
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --image "${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ needs.publish.outputs.image_tag }}"
      - name: Bind free Azure managed certificates
        run: |
          az containerapp hostname add \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --hostname aliberkyildiz.com || true
          az containerapp hostname bind \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --environment "$CONTAINER_APP_ENVIRONMENT" \
            --hostname aliberkyildiz.com \
            --validation-method HTTP
          az containerapp hostname add \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --hostname www.aliberkyildiz.com || true
          az containerapp hostname bind \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --environment "$CONTAINER_APP_ENVIRONMENT" \
            --hostname www.aliberkyildiz.com \
            --validation-method CNAME
      - name: Smoke test
        run: curl --fail --retry 18 --retry-delay 10 --max-time 15 https://aliberkyildiz.com/healthz
      - name: Deployment summary
        if: always()
        run: |
          echo "## Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ needs.publish.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: Azure Container Apps Consumption" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: https://aliberkyildiz.com" >> "$GITHUB_STEP_SUMMARY"
